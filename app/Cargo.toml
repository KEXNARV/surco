[package]
name = "surco-app"
version = "0.1.0"
edition = "2024"
description = "Interfaz de surco: ventana nativa con el núcleo de Iris"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
iced = { version = "0.14", features = ["wgpu", "image", "tokio", "advanced", "canvas"] }
pollster = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "fs"] }
